<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务类型选择</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        postal: {
                            primary: '#00963f',  // 邮政绿主色
                            secondary: '#e8f5e9', // 浅绿色背景
                            hover: '#007a33',    // 深绿色(悬停)
                            light: '#f0f9f0',    // 更浅的背景色
                            gray: '#f5f5f5',      // 灰色背景
                            orange: '#ff9800',   // 意向商户橙色
                            orangeLight: '#fff3e0' // 意向商户浅橙色
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /**
         * 页面全局样式
         * @description 设置页面背景为白色，字体为系统字体
         */
        body {
            background-color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /**
         * 卡片悬浮效果
         */
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        /**
         * 卡片图标样式
         */
        .card-icon {
            height: 64px;
            width: 64px;
            margin: 0 auto 16px;
        }
    </style>
    <link rel="stylesheet" href="mobile-shell.css">
    <script defer src="mobile-shell.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="bg-postal-primary text-white">
        <a href="../移动端/首页.html" id="back-home" aria-label="返回首页">返回</a>
        <div class="flex items-center justify-between p-4">
            <!-- 
                @section 顶部标题栏
                @description 任务管理标题，字体居中
            -->
            <div class="flex items-center justify-center w-full">
                <h1 class="text-lg font-medium text-center w-full">任务管理</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button class="w-6 h-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-8">
        <div class="text-center mb-8">
           
            <h2 class="text-2xl font-bold text-gray-800">请选择商户类型</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 存量商户任务卡片 -->
            <!--
                @component 存量商户任务卡片
                @description 跳转到存量商户任务列表页，卡片底色为邮政浅绿色
            -->
            <a href="任务列表页（商户）.html" class="task-card bg-postal-secondary rounded-lg p-6 shadow-md text-center">
                <div class="card-icon bg-white rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-postal-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">存量商户</h3>
                <p class="text-gray-600 mb-4">客户经理可查看、领取和处理微邮付正式商户的任务。
                </p>
                <div class="bg-postal-primary text-white py-3 w-full rounded-full mt-2 hover:bg-postal-hover text-base font-medium cursor-pointer">
                    立即进入
                </div>
            </a>

            <!-- 目标商户任务卡片 -->
            <!--
                @component 目标商户任务卡片
                @description 跳转到目标商户任务列表页，卡片底色为浅蓝色
            -->
            <a href="任务列表页（目标商户）.html" class="task-card bg-blue-50 rounded-lg p-6 shadow-md text-center">
                <div class="card-icon bg-white rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">目标商户</h3>
                <p class="text-gray-600 mb-4">客户经理可管理未入驻微邮付的潜在商户，通过持续走访、维护、信息完善，推动其转化为微邮付正式商户。</p>
                <div class="bg-blue-600 text-white py-3 w-full rounded-full mt-2 hover:bg-blue-700 text-base font-medium cursor-pointer">
                    立即进入
                </div>
            </a>
        </div>
    </div>

</body>
</html>
