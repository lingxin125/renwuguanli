<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00963f">
  <link rel="icon" href="data:,">
  <title>商户地图 · 邮付管家</title>
  <link rel="stylesheet" href="mobile-shell.css">
  <link rel="stylesheet" href="map-adapter.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="merchant-map.css?v=20261013-4">
  <script defer src="mobile-shell.js?v=20261008-4"></script>
  <script defer src="prototype-store.js?v=20261010-3"></script>
  <script defer src="amap-config.js"></script>
  <script defer src="map-outlets.js?v=20261009-1"></script>
  <script defer src="map-adapter.js?v=20261009-14"></script>
    <script defer src="merchant-map.js?v=20261013-4"></script>
</head>
<body>
  <header><h1>商户地图</h1><button onclick="location.href='../移动端/首页.html'" id="back-to-home">返回</button></header>
  <div id="merchant-app">
    <section class="map-header">
      <div class="map-header-actions"><i id="location-icon" class="ti ti-current-location" aria-hidden="true"></i><span id="location-distance" role="status"><span class="location-text">尚未定位</span></span><button id="locate-person" type="button"><span>更新定位</span></button></div>
      <div class="search-filter-row"><form id="merchant-search" role="search"><i class="ti ti-search" aria-hidden="true"></i><input id="merchant-query" type="search" aria-label="搜索商户名称或商户号" placeholder="搜索商户名称 / 商户号" autocomplete="off"><button type="submit">搜索</button></form><button id="open-filters" aria-label="筛选"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i><span id="active-filter-count"></span></button></div>
      <div class="merchant-stage-tabs" role="tablist" aria-label="商户类型"><button role="tab" data-stage="all" aria-selected="true">全部商户</button><button role="tab" data-stage="formal" aria-selected="false">正式商户</button><button role="tab" data-stage="tasks" aria-selected="false">任务商户</button><button role="tab" data-stage="target" aria-selected="false">目标商户</button><button role="tab" data-stage="intention" aria-selected="false">意向商户</button></div>
    </section>
    <section class="merchant-map-area" aria-label="地图操作区">
      <div id="merchant-map-canvas" aria-label="商户地图"></div>
      <div class="map-surface-badge"><span class="map-surface-dot"></span><span>全国商户分布</span><b id="map-merchant-count-surface">0</b></div>
      <div class="map-layer-tools"><button id="heat-toggle" aria-label="关闭热力图" aria-pressed="true"><i class="ti ti-flame" aria-hidden="true"></i><span>热力图</span></button><button id="points-toggle" aria-label="开启点位" aria-pressed="false"><i class="ti ti-map-pin" aria-hidden="true"></i><span>开启点位</span></button><button id="outlets-toggle" aria-label="关闭网点" aria-pressed="true"><i class="ti ti-building-bank" aria-hidden="true"></i><span>关闭网点</span></button><button id="outlets-settings" aria-label="网点设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l.7 3 2.6 1.5 3 .1 1.5 5.2-2.3 2-1.3 2.7.3 3-5.3 2-2.2-2-3-.4-2.6 1.5-4-4 1.5-2.6-.4-3-2-2.2 2-5.3 3 .3L9 3Z" transform="translate(2 1) scale(.8)"/><circle cx="12" cy="12" r="3"/></svg><span>网点设置</span></button></div>
      <div id="map-legend" hidden><p><b class="dot outlet"></b>邮政网点 <b class="dot person"></b>我的位置</p><p><b class="dot formal"></b>正式商户 <b class="dot target"></b>目标商户 <b class="dot intention"></b>意向商户</p><p>圆形数字为聚合商户数</p><div id="heat-legend">商户密度 <span class="heat-ramp"></span> 低 → 高</div></div>
      <div class="map-zoom-controls"><button id="zoom-in" aria-label="放大地图"><i class="ti ti-plus" aria-hidden="true"></i></button><button id="zoom-out" aria-label="缩小地图"><i class="ti ti-minus" aria-hidden="true"></i></button></div>
      <div id="map-connection" role="status"></div>
      <button id="retry-map" class="map-retry" hidden>重新连接</button>
      <button id="cancel-map-pick" hidden>取消选点</button>
    </section>
    <section id="merchant-sheet" aria-label="商户列表" class="merchant-sheet" hidden>
      <button id="sheet-expand" class="sheet-grip" aria-label="展开商户列表" aria-expanded="false"><span></span></button>
      <div class="sheet-summary"><h2>商户 <strong id="map-merchant-count">0</strong></h2><button id="close-sheet" aria-label="关闭商户列表">关闭</button></div>
      <div id="selected-merchant" hidden></div>
      <div id="map-merchant-list"></div>
    </section>
    <div id="map-toast" role="status" hidden></div>
    <div id="map-dialog-backdrop" hidden aria-hidden="true"></div><dialog id="map-dialog"><header><h2 id="dialog-title"></h2><span id="dialog-distance" class="place-distance" hidden></span><button id="dialog-close" aria-label="关闭"><i class="ti ti-x" aria-hidden="true"></i></button></header><form id="map-dialog-form"><p id="dialog-error" role="alert" hidden></p><div id="dialog-body"></div><footer id="dialog-footer"></footer></form></dialog>
  </div>
</body>
</html>
